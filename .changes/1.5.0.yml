version: 1.5.0
pr_number: 70
new_features:
- description: Raises the minimum supported dbt version from v1.3.0 to v1.10.0.
under_the_hood:
- description: Adds `dbt_utils.unique_combination_of_columns` tests to the staging and end models. The tests use the `arguments` syntax introduced in dbt v1.10.0, the new minimum supported version.
- title: Documentation updates
  description: Updates the staging model documentation so that it matches the columns
    the models actually output.
  details:
  - Adds documentation for the `source_relation` column to the nine staging models
    that output it but did not document it.
  - Removes the `assignee_status` column from the `stg_asana__task` documentation,
    since the model no longer outputs this field.
